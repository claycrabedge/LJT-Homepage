name: Cleanup template assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Remove unused template sample assets
        run: |
          git rm -r --ignore-unmatch markdown_generator talkmap files
          git rm --ignore-unmatch talkmap.ipynb talkmap.py talkmap_out.ipynb AGENTS.md
          if git diff --cached --quiet; then
            echo "No template assets needed removal."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Remove unused template sample assets"
            git push origin master
          fi
