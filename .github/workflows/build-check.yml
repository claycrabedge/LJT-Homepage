name: Jekyll build check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Verify generated content
        run: |
          test -f _site/index.html
          test -f _site/publications/index.html
          grep -q "Junteng Liu" _site/index.html
          grep -q "SynLogic" _site/index.html
          grep -q "On the Perception Bottleneck of VLMs for Chart Understanding" _site/index.html
          grep -q "On the Universal Truthfulness Hyperplane Inside LLMs" _site/index.html
          grep -q "In-Context Sharpness as Alerts" _site/index.html
          grep -q "C-Eval" _site/index.html
          grep -q "Composing Parameter-Efficient Modules with Arithmetic Operations" _site/index.html
          grep -q "Zhiyuan Honor Scholarship" _site/index.html
          grep -q "jliugi@connect.ust.hk" _site/index.html
          grep -q "Vicent0205" _site/index.html
          grep -q "junteng88716710" _site/index.html
          test -f _site/publication/synlogic/index.html
          test -f _site/publication/perception-bottleneck-vlms/index.html
          test -f _site/publication/universal-truthfulness-hyperplane/index.html
          test -f _site/publication/in-context-sharpness/index.html
          test -f _site/publication/c-eval/index.html
          test -f _site/publication/composing-parameter-efficient-modules/index.html
          if grep -R "Paper Title Number\|Academic Pages is a ready-to-fork\|Short biography for the left-hand sidebar" _site; then
            echo "Template placeholder content remains in the built site."
            exit 1
          fi
          echo "Generated site content verification passed."
